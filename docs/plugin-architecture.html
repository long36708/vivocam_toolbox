<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vivocam-toolbox 插件化架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>vivocam-toolbox 插件化架构</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-arch-title plugin-arch-desc">
        <title id="plugin-arch-title">vivocam-toolbox 插件化架构</title>
        <desc id="plugin-arch-desc">插件化架构：插件包经校验门原子安装为活跃插件，旧版本归档可回退；cam.sh 引擎按用户插件优先于内置描述发现移植包，并从内容寻址库池铺库；模块目录与运行期数据分离，模块更新不丢插件。</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= zones (before arrows/nodes) ================= -->
        <!-- 模块目录：KSU 更新即替换 -->
        <rect x="48" y="192" width="328" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="60" y="196" width="184" height="16" rx="2" fill="#f5f5f5"/>
        <text x="68" y="208" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">模块目录 · KSU 更新即替换</text>

        <!-- 运行期数据：模块更新不丢 -->
        <rect x="424" y="192" width="808" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="436" y="196" width="300" height="16" rx="2" fill="#f5f5f5"/>
        <text x="444" y="208" fill="#5a6580" font-size="12" font-weight="500"
              font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">运行期数据 /data/adb/vivocam · 模块更新不丢</text>

        <line x1="580" y1="344" x2="580" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- A5 引擎 → 活跃插件（发现：用户插件优先） -->
        <path d="M 328,396 H 380 Q 388,396 388,388 V 324 Q 388,316 396,316 H 448"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 328,424 H 396 Q 404,424 404,432 V 440 Q 404,448 412,448 H 448"

        <!-- A7 内置描述 → 引擎（fallback 发现） -->

        <text x="334" y="196" fill="#5a6580" font-size="8" font-family="'Geist Mono',ui-monospace,monospace"
              text-anchor="middle" letter-spacing="0.06em">IMPORT</text>

        <rect x="72" y="352" width="256" height="88" rx="6" fill="#f5f5f5"/>

        <rect x="80" y="358" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="95" y="367" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',ui-monospace,monospace"
              text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="200" y="394" fill="#2d3142" font-size="12" font-weight="600"

        <!-- N8 内置描述（optional / fallback） -->
        <rect x="72" y="488" width="256" height="72" rx="6" fill="#f5f5f5"/>

        <text x="103" y="503" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',ui-monospace,monospace"

        <text x="1096" y="282" fill="#2d3142" font-size="12" font-weight="600"
              font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
              text-anchor="middle">版本归档</text>
        <text x="1096" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace"
              text-anchor="middle">.versions/&lt;family&gt;/&lt;ver&gt;/</text>

        <rect x="448" y="400" width="264" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="456" y="406" width="34" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
